name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricevue
          POSTGRES_PASSWORD: pricevue
          POSTGRES_DB: pricevue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pricevue" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pricevue:pricevue@localhost:5432/pricevue
      AMAZON_ASSOCIATE_TAG: pricevue-21
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
